spring.application.name=BusquedasHoteleras
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=3000
spring.datasource.hikari.data-source-properties.oracle.net.OUTBOUND_CONNECT_TIMEOUT=3000ms
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=20000
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
